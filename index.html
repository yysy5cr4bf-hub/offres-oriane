<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les offres d'Oriane</title>
<meta name="description" content="Offres d'emploi en événementiel, communication et graphisme dans le sport et l'automobile.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#EEF5FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#07111F" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Offres">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Saira+Condensed:wght@600;700&display=swap">
<style>
/* Mise en page : une colonne de « pass d'accréditation » (720px max).
   Chaque offre = un badge : bandeau couleur du secteur + fente de lanière, corps, pied avec code et suivi.
   Couleurs : celles d'Angers Lac de Maine Handball (rose #FF007A, bleu ciel #00A5E9, bleu #2B689C).
   Les teintes vives ne servent qu'au décor ; textes et boutons utilisent des nuances au contraste ≥ 4,5:1. */
:root {
  --bg: #EEF5FB;
  --surface: #FFFFFF;
  --surface-2: #F2F7FC;
  --ink: #0E2A47;
  --muted: #4A6079;
  --line: #D3E2F0;
  --accent: #C2005F;
  --accent-ink: #FFFFFF;
  --accent-soft: #FFE3F0;
  --pink-vivid: #FF007A;
  --sky: #00A5E9;
  --sport: #C2005F;   --sport-ink: #FFFFFF;
  --auto: #2B689C;    --auto-ink: #FFFFFF;
  --event: #00A5E9;   --event-ink: #0E2A47;
  --signal: #A35A00;
  --signal-soft: #FCEDD2;
  --good: #157A4C;
  --good-soft: #DCF1E6;
  --shadow: 0 1px 2px rgb(14 42 71 / .06), 0 10px 24px rgb(14 42 71 / .08);
  --display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #07111F; --surface: #0F1D30; --surface-2: #142540; --ink: #EAF2FA; --muted: #9DB2C8;
    --line: #22385A; --accent: #FF5CA8; --accent-ink: #07111F; --accent-soft: #3A1027;
    --pink-vivid: #FF3D94; --sky: #00A5E9;
    --sport: #FF5CA8; --sport-ink: #07111F;
    --auto: #6FB1E8;  --auto-ink: #07111F;
    --event: #00A5E9; --event-ink: #07111F;
    --signal: #F2B44C; --signal-soft: #3A2B10; --good: #5FCB98; --good-soft: #12301F;
    --shadow: 0 1px 2px rgb(0 0 0 / .45), 0 12px 28px rgb(0 0 0 / .35);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--body);
  padding-top: max(24px, env(safe-area-inset-top, 0px));
  padding-bottom: max(48px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* En-tête */
.masthead { display: flex; flex-direction: column; gap: 10px; }
.kicker { margin: 0; font: 600 12px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.masthead h1 { margin: 0; font: 700 clamp(40px, 12vw, 64px)/.9 var(--display); text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 0; padding: 0; list-style: none; }
.stats li { display: inline-flex; align-items: baseline; gap: 6px; padding: 7px 11px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 14px; }
.stats b { font: 700 18px/1 var(--display); font-variant-numeric: tabular-nums; }
.stats .hot b { color: var(--accent); }
/* Liseré aux couleurs du club, purement décoratif */
.club-stripe { display: flex; gap: 4px; margin: 2px 0 0; }
.club-stripe i { display: block; height: 6px; border-radius: 3px; }
.club-stripe i:nth-child(1) { width: 56px; background: var(--pink-vivid); }
.club-stripe i:nth-child(2) { width: 32px; background: var(--sky); }
.club-stripe i:nth-child(3) { width: 14px; background: var(--auto); }
.updated { margin: 0; font: 500 12px/1.4 var(--mono); color: var(--muted); }

/* Recherche, tri, filtres */
.controls { display: flex; flex-direction: column; gap: 10px; }
.search { display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.search svg { flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: 500 16px/1.2 var(--body); padding: 12px 0; }
.search input::placeholder { color: var(--muted); }
.search input:focus { outline: none; }
.search:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
.selects { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sel { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.sel span { font: 600 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding-left: 2px; }
select {
  width: 100%; min-height: 44px; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: 600 14.5px/1.2 var(--body);
}
.cities { display: flex; flex-wrap: wrap; gap: 8px; }
.chip-btn {
  min-height: 40px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: 600 14px/1 var(--body); cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.chip-btn .n { font: 600 12px/1 var(--mono); color: var(--muted); }
.chip-btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.chip-btn[aria-pressed="true"] .n { color: var(--surface); opacity: .7; }

/* Pass */
.list { display: flex; flex-direction: column; gap: 18px; }
.pass {
  --fam: var(--event); --fam-ink: var(--event-ink);
  position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 22px;
  box-shadow: var(--shadow); overflow: hidden; min-width: 0;
}
.pass[data-family="sport"] { --fam: var(--sport); --fam-ink: var(--sport-ink); }
.pass[data-family="auto"] { --fam: var(--auto); --fam-ink: var(--auto-ink); }
.band {
  position: relative; background: var(--fam); color: var(--fam-ink);
  padding: 30px 18px 11px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
  font: 600 12px/1.1 var(--mono); letter-spacing: .12em; text-transform: uppercase;
}
.band::before {
  content: ""; position: absolute; top: 10px; left: 50%; width: 64px; height: 12px; transform: translateX(-50%);
  border-radius: 8px; background: var(--bg); box-shadow: inset 0 2px 3px rgb(0 0 0 / .25);
}
.band .kind { padding: 4px 7px; border-radius: 6px; border: 1.5px solid currentColor; }
.body { position: relative; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.new-tag {
  align-self: flex-start; margin: 0; padding: 5px 8px; border-radius: 7px;
  background: var(--accent-soft); color: var(--accent); font: 600 12px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
}
.title { margin: 0; font: 700 29px/1 var(--display); text-transform: uppercase; letter-spacing: .005em; text-wrap: balance; padding-right: 8px; }
.employer { margin: -4px 0 0; font-weight: 600; }
.employer span { color: var(--muted); font-weight: 400; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 0; }
.facts div { background: var(--surface-2); border-radius: 12px; padding: 9px 11px; min-width: 0; }
.facts dt { font: 600 11px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 3px 0 0; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.facts dd.na { color: var(--muted); font-weight: 500; }
.summary { margin: 0; }
.match-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.match { display: inline-flex; align-items: center; gap: 8px; font: 600 12.5px/1 var(--mono); color: var(--muted); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); }
.dots i.on { background: var(--fam); border-color: var(--fam); }
.pass[data-score="5"] .match { color: var(--ink); }
.plus {
  flex: none; width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink); display: grid; place-items: center; cursor: pointer;
}
.plus svg { transition: transform .2s ease; }
.plus[aria-expanded="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.plus[aria-expanded="true"] svg { transform: rotate(45deg); }

.detail { border-top: 1px dashed var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 16px; }
.detail h3 { margin: 0 0 6px; font: 600 12px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.detail ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.detail p { margin: 0; }
.fit { display: grid; grid-template-columns: 1fr; gap: 10px; }
.fit > div { border-radius: 12px; padding: 11px 13px; }
.fit .pro { background: var(--good-soft); }
.fit .pro h3 { color: var(--good); }
.fit .con { background: var(--signal-soft); }
.fit .con h3 { color: var(--signal); }
.email-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.email-row code { font: 500 14px/1.4 var(--mono); user-select: all; overflow-wrap: anywhere; min-width: 0; }
.hint { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

.btn {
  min-height: 48px; border-radius: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  font: 600 15px/1.15 var(--body); padding: 10px 14px; cursor: pointer; text-decoration: none;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 16px; letter-spacing: .01em; }
.btn.small { min-height: 36px; font-size: 13.5px; padding: 6px 10px; }
.offer-link { align-self: center; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; color: var(--accent); font-weight: 600; text-decoration: none; }
.offer-link small { color: var(--muted); font-weight: 400; font-size: 13px; }

.foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 18px 16px; border-top: 2px dashed var(--line); background: var(--surface-2);
}
.code { display: flex; align-items: center; gap: 10px; min-width: 0; font: 500 12px/1 var(--mono); color: var(--muted); letter-spacing: .04em; white-space: nowrap; }
.barcode {
  width: 52px; height: 22px; flex: none; opacity: .75;
  background: repeating-linear-gradient(90deg, var(--ink) 0 2px, transparent 2px 4px, var(--ink) 4px 5px, transparent 5px 8px, var(--ink) 8px 11px, transparent 11px 12px, var(--ink) 12px 13px, transparent 13px 16px);
}
.status { flex: none; width: 142px; }
.status select { min-height: 40px; font-size: 14px; }
.pass[data-status="applied"] .status select { border-color: var(--accent); color: var(--accent); }
.pass[data-status="interview"] .status select { border-color: var(--good); color: var(--good); }

/* Tampon de suivi */
.stamp {
  position: absolute; top: 14px; right: 14px; transform: rotate(-9deg); pointer-events: none;
  padding: 5px 9px; border: 2.5px solid currentColor; border-radius: 8px;
  font: 700 15px/1 var(--display); letter-spacing: .08em; text-transform: uppercase; opacity: .9;
}
.pass[data-status="applied"] .stamp { color: var(--accent); }
.pass[data-status="interview"] .stamp { color: var(--good); }
.pass[data-status="refused"] .stamp, .pass[data-status="skip"] .stamp { color: var(--muted); }
.pass[data-status="refused"], .pass[data-status="skip"] { opacity: .62; }
.pass[data-status]:not([data-status="todo"]) .title { padding-right: 96px; }

.empty, .loading { margin: 0; padding: 22px; border-radius: 18px; border: 1px dashed var(--line); background: var(--surface); color: var(--muted); text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.footer { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

@media (min-width: 560px) {
  .fit { grid-template-columns: 1fr 1fr; }
  .facts { grid-template-columns: repeat(4, 1fr); }
  .title { font-size: 33px; }
}
@media (prefers-reduced-motion: reduce) { .plus svg { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="kicker">Pass emploi · Événementiel · Communication · Graphisme</p>
    <h1>Les offres d'Oriane</h1>
    <p class="club-stripe" aria-hidden="true"><i></i><i></i><i></i></p>
    <ul class="stats" id="stats" aria-label="Résumé"></ul>
    <p class="updated" id="updated">Chargement…</p>
  </header>

  <section class="controls" aria-label="Rechercher et filtrer">
    <label class="search" for="q">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.5" cy="7.5" r="5.5" stroke="currentColor" stroke-width="2" fill="none"/><path d="M12 12l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="sr-only">Rechercher une offre</span>
      <input id="q" type="search" placeholder="Rechercher : rugby, CDI, Nantes…" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="selects">
      <label class="sel" for="sort"><span>Trier</span>
        <select id="sort">
          <option value="score">Compatibilité</option>
          <option value="recent">Plus récentes</option>
          <option value="salary">Salaire</option>
        </select>
      </label>
      <label class="sel" for="statusFilter"><span>Suivi</span>
        <select id="statusFilter">
          <option value="all">Toutes</option>
          <option value="todo">À postuler</option>
          <option value="applied">Postulé</option>
          <option value="interview">Entretien</option>
          <option value="refused">Refus</option>
          <option value="skip">Pas pour moi</option>
        </select>
      </label>
    </div>
    <nav class="cities" id="cities" aria-label="Filtrer par ville"></nav>
  </section>

  <main class="list" id="list" aria-live="polite">
    <p class="loading">Chargement des offres…</p>
  </main>

  <p class="footer">Offres relevées chaque matin. Ton suivi de candidature est enregistré sur ce téléphone uniquement.</p>
</div>

<script>
/* ---------- Réglages ---------- */
const CITIES = ["Toutes", "Le Mans", "Nantes", "Angers", "Bordeaux", "Vendée"];
const FAMILY_LABEL = { sport: "Sport", auto: "Automobile", event: "Événementiel" };
const MATCH_WORD = { 5: "Très compatible", 4: "Compatible", 3: "En partie", 2: "Peu compatible", 1: "Hors profil" };
const STATUS = { todo: "À postuler", applied: "Postulé", interview: "Entretien", refused: "Refus", skip: "Pas pour moi" };
const STORE_KEY = "offres-oriane:suivi";

/* ---------- Outils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const day = iso => new Date(String(iso) + "T12:00:00");
const frDate = (iso, opts = { day: "numeric", month: "long", year: "numeric" }) => { const d = day(iso); return isNaN(d) ? String(iso || "") : d.toLocaleDateString("fr-FR", opts); };
const host = url => { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; } };
const isNew = o => !!o.added && !isNaN(day(o.added)) && (Date.now() - day(o.added)) / 864e5 < 3;
const list = items => `<ul>${(items || []).map(i => `<li>${esc(i)}</li>`).join("")}</ul>`;

/* Suivi de candidature : mémorisé dans ce navigateur uniquement */
function loadStatus() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } }
function saveStatus(map) { try { localStorage.setItem(STORE_KEY, JSON.stringify(map)); } catch { /* stockage indisponible : le suivi reste le temps de la visite */ } }
let tracking = loadStatus();
const statusOf = o => tracking[o.id] || "todo";

/* ---------- État ---------- */
let DATA = { updated: "", offers: [] };
let city = "Toutes";

/* ---------- Rendu ---------- */
function renderStats() {
  const offers = DATA.offers;
  const fresh = offers.filter(isNew).length;
  const applied = offers.filter(o => ["applied", "interview"].includes(statusOf(o))).length;
  const items = [
    `<li><b>${offers.length}</b> offres</li>`,
    fresh ? `<li class="hot"><b>${fresh}</b> nouvelle${fresh > 1 ? "s" : ""}</li>` : "",
    applied ? `<li><b>${applied}</b> candidature${applied > 1 ? "s" : ""}</li>` : ""
  ];
  $("#stats").innerHTML = items.join("");
  $("#updated").textContent = DATA.updated ? `Mis à jour le ${frDate(DATA.updated)}` : "";
}

function renderCities() {
  $("#cities").innerHTML = CITIES.map(c => {
    const n = c === "Toutes" ? DATA.offers.length : DATA.offers.filter(o => o.city === c).length;
    if (!n && c !== city) return "";
    return `<button class="chip-btn" type="button" data-city="${esc(c)}" aria-pressed="${c === city}">${esc(c)} <span class="n">${n}</span></button>`;
  }).join("");
}

function passHTML(o, i) {
  const st = statusOf(o);
  const dots = [1, 2, 3, 4, 5].map(n => `<i class="${n <= o.score ? "on" : ""}"></i>`).join("");
  const posted = o.posted ? (o.postedApprox ? "≈ " : "") + frDate(o.posted, { day: "numeric", month: "short" }) : "—";
  const na = v => /^(Non|Selon)/.test(v || "");
  const detail = [
    o.about ? `<section><h3>L'employeur</h3><p>${esc(o.about)}</p></section>` : "",
    o.dates ? `<section><h3>Conditions</h3><p>${esc(o.dates)}</p></section>` : "",
    o.missions?.length ? `<section><h3>Missions</h3>${list(o.missions)}</section>` : "",
    o.profile?.length ? `<section><h3>Profil demandé</h3>${list(o.profile)}</section>` : "",
    (o.pros?.length || o.cons?.length) ? `<div class="fit">
        ${o.pros?.length ? `<div class="pro"><h3>Pour toi</h3>${list(o.pros)}</div>` : ""}
        ${o.cons?.length ? `<div class="con"><h3>À vérifier</h3>${list(o.cons)}</div>` : ""}
      </div>` : "",
    o.applyEmail ? `<section><h3>Candidature par email</h3>
        <div class="email-row"><code>${esc(o.applyEmail)}</code>
        <button class="btn small" type="button" data-action="copy" data-text="${esc(o.applyEmail)}">Copier l'adresse</button></div>
        ${o.applySubject ? `<p class="hint">Objet : ${esc(o.applySubject)}</p>` : ""}</section>` : "",
    o.extra ? `<section><p>${esc(o.extra)}</p></section>` : ""
  ].join("");
  const code = `${o.zone || "00"}-${String(i + 1).padStart(3, "0")}`;

  return `<article class="pass" id="o-${esc(o.id)}" data-id="${esc(o.id)}" data-family="${esc(o.family || "event")}" data-score="${o.score}" data-status="${st}">
    <div class="band"><span>${esc(FAMILY_LABEL[o.family] || "Événementiel")} · Zone ${esc(o.zone || "")}</span><span class="kind">${esc(o.kind === "NA" ? "Contrat ?" : o.kind)}</span></div>
    <div class="body">
      ${st !== "todo" ? `<span class="stamp" aria-hidden="true">${esc(STATUS[st])}</span>` : ""}
      ${isNew(o) ? `<p class="new-tag">Nouveau · ${esc(frDate(o.added, { day: "numeric", month: "long" }))}</p>` : ""}
      <h2 class="title">${esc(o.title)}</h2>
      <p class="employer">${esc(o.employer)} <span>· ${esc(o.sector)}</span></p>
      <dl class="facts">
        <div><dt>Contrat</dt><dd class="${o.kind === "NA" ? "na" : ""}">${esc(o.kind === "NA" ? "Non précisé" : o.contract)}</dd></div>
        <div><dt>Lieu</dt><dd>${esc(o.location)}</dd></div>
        <div><dt>Salaire</dt><dd class="${na(o.salary) ? "na" : ""}">${esc(o.salary || "Non précisé")}</dd></div>
        <div><dt>Publiée</dt><dd>${esc(posted)}</dd></div>
      </dl>
      <p class="summary">${esc(o.summary)}</p>
      <div class="match-row">
        <span class="match" title="Compatibilité avec ton profil"><span class="dots" aria-hidden="true">${dots}</span>${esc(MATCH_WORD[o.score] || "")}</span>
        <button class="plus" type="button" data-action="toggle" aria-expanded="false" aria-controls="d-${esc(o.id)}" aria-label="Voir le détail du poste">
          <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3v12M3 9h12" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
      <div class="detail" id="d-${esc(o.id)}" hidden>${detail}</div>
      <a class="btn primary" href="${esc(o.applyUrl || o.offerUrl)}" target="_blank" rel="noopener">Candidater <span aria-hidden="true">↗</span></a>
      <a class="offer-link" href="${esc(o.offerUrl)}" target="_blank" rel="noopener">Voir l'offre <span aria-hidden="true">↗</span> <small>${esc(host(o.offerUrl))}</small></a>
    </div>
    <div class="foot">
      <span class="code"><i class="barcode" aria-hidden="true"></i>N° ${esc(code)}</span>
      <label class="status"><span class="sr-only">Suivi de candidature</span>
        <select data-action="status">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}"${k === st ? " selected" : ""}>${v}</option>`).join("")}</select>
      </label>
    </div>
  </article>`;
}

function sortOffers(items, mode) {
  const rank = o => ["refused", "skip"].includes(statusOf(o)) ? 1 : 0;
  const recent = o => String(o.added || o.posted || "");
  const by = {
    score: (a, b) => b.score - a.score || recent(b).localeCompare(recent(a)),
    recent: (a, b) => recent(b).localeCompare(recent(a)) || b.score - a.score,
    salary: (a, b) => (b.salaryMonthly ?? -1) - (a.salaryMonthly ?? -1) || b.score - a.score
  }[mode] || (() => 0);
  return items.slice().sort((a, b) => rank(a) - rank(b) || by(a, b));
}

function renderList() {
  const q = norm($("#q").value.trim());
  const sf = $("#statusFilter").value;
  const order = new Map(DATA.offers.map((o, i) => [o.id, i]));
  let items = DATA.offers.filter(o => city === "Toutes" || o.city === city);
  if (sf !== "all") items = items.filter(o => statusOf(o) === sf);
  if (q) items = items.filter(o => norm([o.title, o.employer, o.sector, o.city, o.location, o.contract, o.summary, ...(o.missions || [])].join(" ")).includes(q));
  items = sortOffers(items, $("#sort").value);
  $("#list").innerHTML = items.length
    ? items.map(o => passHTML(o, order.get(o.id))).join("")
    : `<div class="empty"><span>Aucune offre ne correspond.</span><button class="btn small" type="button" data-action="reset">Tout afficher</button></div>`;
}

function renderAll() { renderStats(); renderCities(); renderList(); }

/* ---------- Interactions ---------- */
$("#cities").addEventListener("click", e => {
  const b = e.target.closest("[data-city]"); if (!b) return;
  city = b.dataset.city; renderCities(); renderList();
});
$("#q").addEventListener("input", renderList);
$("#sort").addEventListener("change", renderList);
$("#statusFilter").addEventListener("change", renderList);

$("#list").addEventListener("click", async e => {
  const b = e.target.closest("[data-action]"); if (!b) return;
  const a = b.dataset.action;
  if (a === "toggle") {
    const open = b.getAttribute("aria-expanded") !== "true";
    b.setAttribute("aria-expanded", String(open));
    b.setAttribute("aria-label", open ? "Masquer le détail du poste" : "Voir le détail du poste");
    document.getElementById(b.getAttribute("aria-controls")).hidden = !open;
  } else if (a === "copy") {
    const label = b.textContent;
    try { await navigator.clipboard.writeText(b.dataset.text); b.textContent = "Adresse copiée"; }
    catch { b.textContent = "Sélectionne l'adresse"; }
    setTimeout(() => { b.textContent = label; }, 1800);
  } else if (a === "reset") {
    city = "Toutes"; $("#q").value = ""; $("#statusFilter").value = "all"; renderCities(); renderList();
  }
});

$("#list").addEventListener("change", e => {
  const sel = e.target.closest('select[data-action="status"]'); if (!sel) return;
  const card = sel.closest(".pass"); const id = card.dataset.id;
  if (sel.value === "todo") delete tracking[id]; else tracking[id] = sel.value;
  saveStatus(tracking);
  renderStats();
  /* Mise à jour sur place : la carte reste où elle est jusqu'au prochain tri */
  card.dataset.status = sel.value;
  const body = card.querySelector(".body");
  body.querySelector(".stamp")?.remove();
  if (sel.value !== "todo") body.insertAdjacentHTML("afterbegin", `<span class="stamp" aria-hidden="true">${esc(STATUS[sel.value])}</span>`);
});

/* ---------- Chargement ---------- */
fetch("offres.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => { DATA = { updated: d.updated || "", offers: Array.isArray(d.offers) ? d.offers : [] }; renderAll(); })
  .catch(() => {
    $("#updated").textContent = "";
    $("#list").innerHTML = `<div class="empty"><span>Impossible de charger les offres. Vérifie ta connexion puis recharge la page.</span><button class="btn small" type="button" onclick="location.reload()">Recharger</button></div>`;
  });
</script>
</body>
</html>
